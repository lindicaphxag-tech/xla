name: Publish validated status for PR 50025

on:
  push:
    branches:
      - ci/publish-xla-50025-status-20261011

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PR_HEAD: 0db13ab0470ce06eda5c055c89920f0f964defa2
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact validated source blobs
        run: |
          test "$(git hash-object xla/hlo/transforms/simplifiers/algebraic_simplifier.cc)" = "54467d7a39427be209f4edb780f927ec38084a5a"
          test "$(git hash-object xla/hlo/transforms/simplifiers/algebraic_simplifier_test.cc)" = "f46506cebf8f8672da4ce09f4667da7040fe768b"
      - name: Publish exact-source Bazel validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD}" \
            -f state=success \
            -f context='fork/xla-50025-validation' \
            -f description='exact PR blobs; focused LnPow Bazel test passed' \
            -f target_url='https://github.com/lindicaphxag-tech/xla/actions/runs/38077451597'
